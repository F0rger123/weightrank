<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="WeightRank: count every clean rep, climb the ranks">
  <defs>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#0B0D10"/>
      <stop offset="1" stop-color="#14171C"/>
    </linearGradient>
    <style>
      .t { font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif; }
      .arm { transform-origin: 845px 205px; animation: push 1.6s ease-in-out infinite; }
      .count { animation: blink 1.6s steps(1) infinite; }
      .gauge { transform-origin: 1080px 260px; animation: fill 1.6s ease-in-out infinite; }
      @keyframes push { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-38deg); } }
      @keyframes fill { 0%,100% { transform: scaleY(0.08); } 50% { transform: scaleY(1); } }
      @keyframes blink { 0%,49% { fill: #F2F4F7; } 50%,100% { fill: #C8FF3D; } }
      @media (prefers-reduced-motion: reduce) { .arm, .gauge, .count { animation: none; } }
    </style>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#fade)"/>
  <g transform="translate(70 92) scale(0.17)">
    <polygon points="0,281 287,-6 574,281 574,407 287,120 0,407" fill="#C8FF3D"/>
    <polygon points="0,511 287,224 574,511 574,637 287,350 0,637" fill="#6E8C21"/>
  </g>
  <text x="190" y="150" class="t" font-size="72" font-weight="900" fill="#F2F4F7" letter-spacing="-2">Weight<tspan fill="#C8FF3D">Rank</tspan></text>
  <text x="192" y="198" class="t" font-size="24" font-weight="600" fill="#8A93A0">Your phone camera counts every clean rep. Duel. Climb the ranks.</text>
  <text x="192" y="246" class="t" font-size="16" font-weight="800" fill="#5A626E" letter-spacing="3">FREE · ON-DEVICE · NO PAYWALL</text>
  <!-- stick figure doing push-ups -->
  <g stroke="#C8FF3D" stroke-width="9" stroke-linecap="round" fill="none">
    <line x1="845" y1="205" x2="990" y2="222"/>
    <line x1="990" y1="222" x2="1040" y2="262"/>
    <g class="arm"><line x1="845" y1="205" x2="845" y2="262"/></g>
  </g>
  <circle cx="820" cy="190" r="18" fill="#0B0D10" stroke="#C8FF3D" stroke-width="8"/>
  <line x1="780" y1="266" x2="1060" y2="266" stroke="#272C35" stroke-width="4"/>
  <rect x="1072" y="120" width="16" height="140" rx="8" fill="#1C2027"/>
  <rect class="gauge" x="1072" y="120" width="16" height="140" rx="8" fill="#C8FF3D"/>
  <rect x="1064" y="128" width="32" height="4" rx="2" fill="#C8FF3D"/>
  <text x="900" y="120" class="t count" font-size="64" font-weight="900" text-anchor="middle">12</text>
</svg>
